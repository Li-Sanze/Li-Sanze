<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="title desc">
  <title id="title">How I build and review AI-assisted work</title>
  <desc id="desc">AI-assisted work is planned and built, keeps its plans and handoffs in Sopify, then moves to EvidentLoop for independent review and visual audit artifacts. The audit artifact can be attached to the Sopify plan as evidence. The author contributes to the community-built Fireworks Tech Graph and builds zh-tech-writing, doc-to-sketch, and reading-maps.</desc>
  <style>
    text {
      font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .title { fill: #111827; font-size: 28px; font-weight: 700; }
    .node-title { fill: #111827; font-size: 21px; font-weight: 700; }
    .node-kicker { fill: #374151; font-size: 14px; font-weight: 600; letter-spacing: 0.04em; }
    .node-copy { fill: #6b7280; font-size: 15px; }
    .node-detail { fill: #6b7280; font-size: 13.5px; }
    .flow-label { fill: #4b5563; font-size: 14px; font-weight: 600; }
    .proof-title { fill: #111827; font-size: 17px; font-weight: 700; }
    .proof-copy { fill: #6b7280; font-size: 14px; }
    .section-label { fill: #6b7280; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; }
  </style>

  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#ffffff"/>

  <text x="600" y="58" text-anchor="middle" class="title">How I build and review AI-assisted work</text>

  <!-- Primary semantic flow -->
  <path d="M 348 235 H 450" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="399" y="220" text-anchor="middle" class="flow-label">keep context</text>

  <path d="M 750 235 H 852" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="801" y="220" text-anchor="middle" class="flow-label">review change</text>

  <path d="M 1002 328 V 360 Q 1002 382 980 382 H 712 Q 690 382 690 360 V 328" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="846" y="370" text-anchor="middle" class="flow-label">audit artifact for the plan</text>

  <!-- AI Production -->
  <g>
    <rect x="48" y="138" width="300" height="190" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="198" cy="191" r="21" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <path d="M 198 177 L 202 187 L 213 191 L 202 195 L 198 206 L 194 195 L 183 191 L 194 187 Z" fill="#2563eb"/>
    <text x="198" y="235" text-anchor="middle" class="node-title">Build with AI</text>
    <text x="198" y="267" text-anchor="middle" class="node-copy">Start from a plan</text>
    <text x="198" y="293" text-anchor="middle" class="node-detail">Code, test, and iterate</text>
  </g>

  <!-- Sopify -->
  <g>
    <rect x="450" y="138" width="300" height="190" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <circle cx="600" cy="191" r="21" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
    <path d="M 588 191 A 12 12 0 0 1 608 183" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 608 183 L 607 191 L 615 186 Z" fill="#ea580c"/>
    <path d="M 612 193 A 12 12 0 0 1 592 201" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 592 201 L 593 193 L 585 198 Z" fill="#ea580c"/>
    <text x="600" y="235" text-anchor="middle" class="node-title">Sopify</text>
    <text x="600" y="267" text-anchor="middle" class="node-copy">Keeps plans, decisions, and handoffs</text>
    <text x="600" y="293" text-anchor="middle" class="node-detail">Resume work across AI tools</text>
  </g>

  <!-- EvidentLoop -->
  <g>
    <rect x="852" y="138" width="300" height="190" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <circle cx="1002" cy="191" r="21" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="997" cy="187" r="8" fill="none" stroke="#16a34a" stroke-width="2.2"/>
    <path d="M 1003 193 L 1012 202" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 993 187 L 996 190 L 1002 183" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1002" y="235" text-anchor="middle" class="node-title">EvidentLoop</text>
    <text x="1002" y="267" text-anchor="middle" class="node-copy">Independent review of AI output</text>
    <text x="1002" y="293" text-anchor="middle" class="node-detail">Visual audit with user feedback</text>
  </g>

  <!-- Dogfood proof layer -->
  <g>
    <rect x="72" y="430" width="1056" height="132" rx="16" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="96" y="456" class="section-label">PROJECTS I BUILD AND CONTRIBUTE TO</text>

    <rect x="178" y="476" width="390" height="62" rx="12" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <circle cx="214" cy="507" r="17" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.2"/>
    <path d="M 202 514 L 209 506 L 216 510 L 226 498" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 223 498 H 228 V 503" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
    <text x="244" y="502" class="proof-title">Fireworks Tech Graph</text>
    <text x="244" y="525" class="proof-copy">Community project · contributor</text>

    <rect x="632" y="476" width="390" height="62" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <circle cx="668" cy="507" r="17" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.2"/>
    <rect x="660" y="499" width="7" height="7" rx="1.5" fill="#0f766e"/>
    <rect x="670" y="499" width="7" height="7" rx="1.5" fill="#0f766e"/>
    <rect x="660" y="509" width="7" height="7" rx="1.5" fill="#0f766e"/>
    <rect x="670" y="509" width="7" height="7" rx="1.5" fill="#0f766e"/>
    <text x="698" y="502" class="proof-title">Selected projects</text>
    <text x="698" y="525" class="proof-copy" style="font-size:13px">zh-tech-writing · doc-to-sketch · reading-maps</text>
  </g>

</svg>
